name: Build & Push Backend (Docker Hub)
on:
  push:
    branches: ["main", "deploy"] # Se activa al subir cambios a main o deploy

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: dypaltta 
  BACK_IMAGE: tutorial-ssm-backend
  AWS_REGION: us-east-1
  BACKEND_INSTANCE_ID: i-03d1ac00a92a9c1bb 
  BACKEND_APP_DIR: /home/ssm-user/app_backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el código/repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
          | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Generar tags de la imagen
        id: tags
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Construir y publicar imagen Backend
        run: |
          IMAGE="${DOCKERHUB_NAMESPACE}/${BACK_IMAGE}"
          docker build \
            -f back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile \
            -t "${IMAGE}:${{ steps.tags.outputs.VERSION }}" \
            -t "${IMAGE}:latest" \
            back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push "${IMAGE}:${{ steps.tags.outputs.VERSION }}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el código/repositorio
        uses: actions/checkout@v4

      - name: Configurar AWS credentials (manual con session token)
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region=${AWS_REGION}
          output=json
          EOF

      - name: Deploy backend por SSM (docker compose)
        run: |
          aws ssm send-command \
            --region "${AWS_REGION}" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${BACKEND_INSTANCE_ID}" \
            --parameters commands="[
              'sudo mkdir -p ${BACKEND_APP_DIR}',
              'sudo chmod 777 ${BACKEND_APP_DIR}',
              'cd ${BACKEND_APP_DIR}',
              'sudo docker compose down || true',
              'sudo cat << \'EOF\' > docker-compose.yml',
              'version: \"3.8\"',
              'services:',
              '  db:',
              '    image: mysql:8.0',
              '    container_name: db_despacho',
              '    environment:',
              '      MYSQL_ROOT_PASSWORD: root',
              '      MYSQL_DATABASE: despacho_db',
              '    ports:',
              '      - \"3306:3306\"',
              '    volumes:',
              '      - db_data:/var/lib/mysql',
              '    restart: always',
              '  backend:',
              '    image: dypaltta/tutorial-ssm-backend:latest',
              '    container_name: back_despacho',
              '    ports:',
              '      - \"8080:8080\"',
              '    depends_on:',
              '      - db',
              '    environment:',
              '      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/despacho_db',
              '      - SPRING_DATASOURCE_USERNAME=root',
              '      - SPRING_DATASOURCE_PASSWORD=root',
              '    restart: always',
              'volumes:',
              '  db_data:',
              'EOF',
              'sudo docker compose pull',
              'sudo docker compose up -d'
            ]