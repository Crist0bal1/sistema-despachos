name: Build & Push Frontend (Docker Hub)
on:
  push:
    branches: ["main", "deploy"]

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: dypaltta 
  FRONT_IMAGE: tutorial-ssm-frontend
  AWS_REGION: us-east-1
  FRONTEND_INSTANCE_ID: i-02ae5573c548bac22 
  FRONTEND_APP_DIR: /home/ec2-user/tutorial-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el código/repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
          | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Generar tags de la imagen
        id: tags
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Construir y publicar imagen Frontend
        run: |
          IMAGE="${DOCKERHUB_NAMESPACE}/${FRONT_IMAGE}"
          docker build \
            -f front_despacho/Dockerfile \
            -t "${IMAGE}:${{ steps.tags.outputs.VERSION }}" \
            -t "${IMAGE}:latest" \
            front_despacho
          docker push "${IMAGE}:${{ steps.tags.outputs.VERSION }}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el código/repositorio
        uses: actions/checkout@v4

      - name: Configurar AWS credentials (manual con session token)
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region=${AWS_REGION}
          output=json
          EOF

      - name: Deploy frontend por SSM (docker compose)
        run: |
          aws ssm send-command \
            --region "${AWS_REGION}" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${FRONTEND_INSTANCE_ID}" \
            --parameters commands="[
              \"cd ${FRONTEND_APP_DIR}\",
              \"docker compose pull\",
              \"docker compose up -d\"
            ]"