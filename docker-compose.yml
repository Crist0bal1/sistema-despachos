version: '3.8'

services:
  # 1. Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: db_despacho
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: despacho_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Backend (Spring Boot)
  backend:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: back_despacho
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/despacho_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

  # 3. Frontend (React)
  frontend:
    build:
      context: ./front_despacho
    container_name: front_despacho
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge